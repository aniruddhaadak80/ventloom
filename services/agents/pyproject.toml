[project]
name = "ventloom-agents"
version = "0.1.0"
description = "ventloom agent service: deterministic alert-bulletin rendering and compositional correlation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aniruddha Adak" }]
keywords = ["volcanology", "alerts", "bulletin", "compositional-data", "aitchison"]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/aniruddhaadak80/ventloom"
Repository = "https://github.com/aniruddhaadak80/ventloom"
Issues = "https://github.com/aniruddhaadak80/ventloom/issues"

[project.optional-dependencies]
# Test and lint tooling only; the service itself needs none of this at runtime.
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `app` imports as a package, so the service root must be on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI route bodies read better with a bare `dict[str, Any]` return than
    # with a response_model that duplicates the pydantic classes.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on exception types loosely on purpose, so a broad `except`
# clause is the honest way to express "this must not raise a specific error".
"tests/*" = ["B017", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
