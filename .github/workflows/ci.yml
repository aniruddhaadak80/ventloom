name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  rust:
    name: Rust oracle (cargo check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  go:
    name: Go relay (vet + test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test -race ./...

  python:
    name: Python agents (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  assets:
    name: Asset drift check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/gen-assets.mjs --check

  live:
    name: Live deployment contract
    runs-on: ubuntu-latest
    # Only meaningful once a deployment exists, and only worth running on the
    # default branch. Pull requests get every other gate; this one needs the
    # production alias to exist.
    if: github.ref == 'refs/heads/main'
    needs: [e2e, rust, go, python, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Wait for the deployment to serve the new commit
        env:
          DEPLOY_URL: ${{ vars.VENTLOOM_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "VENTLOOM_DEPLOY_URL is not set; skipping the live gate"
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null -w '%{http_code}' "$DEPLOY_URL/api/health" | grep -q 200; then
              echo "deployment is live after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "deployment never became healthy at $DEPLOY_URL" >&2
          exit 1
      - name: Assert the deployed observatory honours its contract
        env:
          VENTLOOM_URL: ${{ vars.VENTLOOM_DEPLOY_URL }}
        run: |
          # The wait step above skips when no production alias is configured.
          # This step has to skip too, or it runs the smoke test against an
          # empty base URL and fails on a missing configuration rather than on
          # a broken contract.
          if [ -z "$VENTLOOM_URL" ]; then
            echo "VENTLOOM_DEPLOY_URL is not set; skipping the live contract assertions"
            exit 0
          fi
          bun scripts/live-smoke.mjs "$VENTLOOM_URL"
