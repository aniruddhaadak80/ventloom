# Dependabot policy
#
# Why this file looks the way it does:
#   - Grouped minor/patch updates -> one reviewable PR instead of a flood.
#   - Major bumps of toolchain packages are ignored. They cannot resolve
#     against this repo's peer dependencies and previously produced PRs that
#     failed CI in ~6s and sat open forever.
#   - Dependabot SECURITY updates are unaffected by `ignore` and still open.
#
# To take a major upgrade deliberately, bump it by hand or temporarily
# remove the matching ignore rule.

version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: cargo
  directory: /crates/engine
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    cargo-minor-patch:
      update-types:
      - minor
      - patch
# The JavaScript workspace installs with Bun (bun.lock at the root), so the
# npm ecosystem cannot resolve it: security updates for the workspace fail with
# dependency_file_not_supported. Dependabot only supports version updates for
# Bun, so use that ecosystem for routine bumps and apply security updates by
# hand when an advisory fires.
- package-ecosystem: bun
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    bun-minor-patch:
      update-types:
      - minor
      - patch
